 const box=document.getElementById('diag'),msg=document.getElementById('errorText');

  msg.style.whiteSpace='pre-line';
 }catch(e){msg.textContent='Không tìm thấy API /api/network. Website đang chạy trên hosting tĩnh (ví dụ Netlify Drop), nên kết nối TCP của game sẽ không hoạt động. Cần deploy gói V7 trên máy chủ Python. ('+e.message+')'}
